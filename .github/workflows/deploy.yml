name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin ${{ github.ref_name }}
          LATEST_MSG=$(git log -1 --format=%s origin/${{ github.ref_name }})
          if [[ "$LATEST_MSG" == *"chore: bump version"* ]]; then
            echo "Latest commit on origin/${{ github.ref_name }} is already a version bump, skipping."
            git checkout origin/${{ github.ref_name }}
          else
            npm version patch -m "chore: bump version to %s [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            git push --tags
            NEW_TAG=$(git describe --tags --abbrev=0)
            gh release create "$NEW_TAG" --generate-notes || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
